server {
    listen 5173;
    server_name localhost;

    # Allow larger OAuth/Better Auth session cookies in request headers.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    add_header X-Content-Type-Options "nosniff" always;
    # The Workspace shell embeds this app in an iframe at
    # workspace.joydigi.net/?app=task. X-Frame-Options cannot express an
    # allow-list - its ALLOW-FROM form was dropped by every current browser -
    # so the frame policy is stated with CSP, which can. X-Frame-Options has
    # to be gone rather than relaxed: a browser that receives both still
    # enforces SAMEORIGIN and the frame stays blank.
    add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.joydigi.net" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    location = /.well-known/oauth-protected-resource/api/mcp {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-protected-resource/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Kaneo-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server/api {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-authorization-server/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Kaneo-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Kaneo-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Defense in depth if a build leaves a source map in the static directory.
    location ~* \.map$ {
        return 404;
    }

    # The app shell must never be served from cache. With no caching directive
    # at all, a browser falls back to heuristic caching and reuses a stale
    # index.html together with the headers it originally arrived with. That is
    # what kept browsers enforcing X-Frame-Options here long after the header
    # had been removed from the server, and it also hands people an app shell
    # that references hashed assets a later deploy has already deleted.
    #
    # `expires` rather than `add_header Cache-Control`: an add_header inside a
    # location discards every add_header inherited from the server level, which
    # would silently drop the frame-ancestors policy and the other security
    # headers for this exact response. `expires` sets the caching headers
    # without touching that inheritance.
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
