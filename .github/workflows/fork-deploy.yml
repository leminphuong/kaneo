# CI and deployment for this fork.
#
# The upstream workflows in this directory publish to usekaneo's registries and
# need secrets a fork does not have, so they fail noisily. This one is
# self-contained: it checks the code on every push, and deploys only once you
# opt in by setting the DEPLOY_ENABLED repository variable to "true".
name: Fork CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A later push supersedes an in-flight run rather than racing it onto the server.
concurrency:
  group: fork-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Locales in sync
        run: pnpm i18n:check

  deploy:
    name: Deploy to server
    needs: check
    # The job always runs on a push so its result is visible. Whether it
    # actually deploys depends on the SSH secrets being present: a gate in the
    # job's `if` skips silently, which reads exactly like a deploy that ran and
    # did nothing. This way the summary says which secret is missing.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check whether deployment is configured
        id: configured
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          [ -n "$SSH_KEY" ]  || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$SSH_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$SSH_USER" ] || missing="$missing DEPLOY_USER"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing repository secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Add them under Settings -> Secrets and variables -> Actions, then re-run." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Deploy skipped - missing secrets:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.configured.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          # Passed through env, never interpolated into the script body: a
          # ${{ }} expansion inside `run` is substituted as raw text and a
          # value containing shell metacharacters would be executed.
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/kaneo' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # tr -d '\r': a key pasted from a Windows terminal carries CRLF line
          # endings, which OpenSSH rejects with "error in libcrypto" and then
          # silently falls back to password auth.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Validate before connecting. Without this the only symptom is
          # "Permission denied (publickey)", which points at the server rather
          # than at the secret that is actually wrong.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            # Describe the SHAPE of the value, never its contents: enough to
            # say which paste mistake happened without printing the key.
            lines=$(wc -l < ~/.ssh/deploy_key)
            chars=$(wc -c < ~/.ssh/deploy_key)
            first_ok=no; last_ok=no; literal_backslash_n=no
            head -1 ~/.ssh/deploy_key | grep -q -- '-----BEGIN .*PRIVATE KEY-----' && first_ok=yes
            grep -q -- '-----END .*PRIVATE KEY-----' ~/.ssh/deploy_key && last_ok=yes
            # -F: a plain two-character backslash-n. As a regex the same
            # pattern matches any "n" and would mislabel every failure.
            grep -qF '\n' ~/.ssh/deploy_key && literal_backslash_n=yes
            looks_public=no
            head -1 ~/.ssh/deploy_key | grep -qE '^(ssh-|ecdsa-)' && looks_public=yes

            {
              echo "DEPLOY_SSH_KEY is not a usable private key."
              echo "  lines: $lines   characters: $chars"
              echo "  starts with a BEGIN line : $first_ok"
              echo "  contains an END line     : $last_ok"
              echo "  contains a literal \\n    : $literal_backslash_n"
              echo "  looks like a public key  : $looks_public"
              echo
              if [ "$looks_public" = yes ]; then
                echo "=> That is the PUBLIC key. Use the file WITHOUT the .pub extension."
              elif [ "$literal_backslash_n" = yes ]; then
                echo "=> The newlines were escaped. Paste the key as real multiple lines, not one line with \\n."
              elif [ "$first_ok" = no ]; then
                echo "=> The BEGIN line is missing. The paste started too late; include it."
              elif [ "$last_ok" = no ]; then
                echo "=> The END line is missing. The paste stopped too early; include it."
              elif [ "$lines" -lt 4 ]; then
                echo "=> Too few lines: the body was collapsed onto one line. Re-copy preserving line breaks."
              else
                echo "=> Shape looks right, so the key is probably passphrase-protected."
                echo "   Regenerate with: ssh-keygen -t ed25519 -f /root/.ssh/gh_actions_kaneo -N \"\""
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"

            echo "::error::DEPLOY_SSH_KEY is not a usable private key - see the log above."
            exit 1
          fi

          # Trust on first use. For a stricter check, set DEPLOY_KNOWN_HOSTS to
          # the output of `ssh-keyscan -p <port> <host>` and it is used instead.
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          # The remote script reads APP_DIR and REF_NAME from the runner via the
          # quoted heredoc's arguments, so nothing is string-interpolated in.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            bash -s -- "$APP_DIR" "$REF_NAME" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          ref_name="$2"
          cd "$app_dir"
          git fetch --prune origin
          # --ff-only: refuse to deploy a merge nobody reviewed. If this fails,
          # the server has local commits and needs a human.
          git merge --ff-only "origin/$ref_name"
          bash scripts/deploy/deploy.sh
          REMOTE

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
